<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Contact - Projet Inégalité</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../CSS/style.css">

</head>

<body>
    <header>
        <div id="header-container">
            <div id="headerGauche">
                <a id="logoheader"href="accueil.html"><img src = "/Img/logosite.png" alt = "logo"></a><a href="accueil.html">Accueil</a>
                <a href="index.html">Index</a>
                <a href="carte.html">Pays et territoires</a>
            </div>
            <div id ="headerDroite">
                <a class = "boutonheader" href="classement.html">Voir le classement</a>
                <a class = "boutonheader" href="contact.html">A propos</a>
            </div>
        </div>
    </header>

    <section class="approbations">
        <h2>Qui nous sommes ?</h2>
        <div class="approbations-container">
            <div class="approbation">
                <img src="../Img/vi.JPEG" id="photo_victor" alt="Victor">
                <p class="description_approbation">Développeur<br><span class="nom">Victor Proffit</span></p>
            </div>
            <div class="approbation">
                <img src="../Img/benjamin_contact.png" id="photo_benjamin" alt="Arthur">
                <p class="description_approbation">Développeur<br><span class="nom">Benjamin Tonneau</span></p>
            </div>
        </div>
    </section>



    <section class="contact-section">
        <h1>Nous contacter</h1>
        <div class="contact-container">
            <form class="contact-form" id="contactForm">
                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Sujet</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit" >Envoyer</button>
            </form>
            <img src="../Img/formulaire_contact.png" alt = "logo" id="image_formulaire_contact">
        </div>
    </section>

    <section>
        <p>🔗 Lien GitHub : <a href="https://github.com/Victor-prft/web_inegalite" target="_blank">https://github.com/Victor-prft/web_inegalite</a></p>
    </section>

    <footer>
        <div class ="logofooter"><img src="/Img/logosite.png" alt="Logo"></div>
        <nav class="footer-nav">
            <a href="accueil.html">Accueil</a>
            <a href="index.html">Index</a>
            <a href="carte.html">Pays et territoires</a>
            <a href="contact.html">A propos</a>
        </nav>
        <p>© 2025 TONNEAU ET PROFFIT</p>
    </footer>
    <script src="../JS/script.js"></script>
</body>
</html>
